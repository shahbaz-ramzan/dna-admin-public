<div>
    <canvas
        data-chartId="pie-chart"
        baseChart
        type="pie"
        [width]="width ? width : 700"
        [height]="height ? height : 345"
        [data]="pieChartData"
        [labels]="chartLabels"
        [options]="chartOptions"
        [legend]="showLegends"
    >
    </canvas>
    <!-- [colors]="chartColors" -->
</div>
