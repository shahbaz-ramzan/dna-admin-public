<div class="userInfoBar">
    <div class="uAvatar align-items-center d-flex">
        <p-avatarGroup label="P">
            <p-avatar image="{{ images.length && images[0] }}" size="large" shape="circle"> </p-avatar>
            <p-avatar image="{{ images[1] }}" size="large" shape="circle"> </p-avatar>
            <p-avatar image="{{ images[2] }}" size="large" shape="circle"> </p-avatar>
            <ng-container *ngIf="showMultiAvatar">
                <p-avatar size="large" shape="circle" class="plus-user"> +{{ additionalUsers }}</p-avatar>
            </ng-container>
        </p-avatarGroup>
    </div>
