<style>
    .factor-wrap ul {
        margin: 0;
        padding: 0;
        list-style: none;
        border-left: 1px solid black;
        padding-top: 20px;
        text-align: left;
        margin-bottom: 40px;
        min-height: 208px;
        margin-bottom: 25px;
        position: relative;
        top: -4px;
    }

    .factor-wrap ul li {
        color: #333333;
        font-size: 14px;
        padding: 16px 10px;
        position: relative;
    }

    .factor-wrap ul li:first-of-type {
        top: -17px;
    }

    .factor-wrap ul li:nth-child(2) {
        top: -13px;
    }

    .factor-wrap ul li:nth-child(3) {
        top: -11px;
    }

    .factor-wrap ul li:nth-child(4) {
        top: -10px;
    }

    .factor-wrap ul li:nth-child(5) {
        top: -6px;
    }

    .factor-wrap ul li:nth-child(6) {
        top: -4px;
    }

    .factor-wrap ul li:nth-child(7) {
        top: -2px;
    }

    .factor-wrap ul li:nth-child(8) {
        top: 1px;
    }

    .traits-wrap h5 {
        font-size: 14px;
        color: black;
        font-weight: 600;
    }

    .factor-wrap h5 {
        position: relative;
        top: -16px;
        font-size: 14px;
        font-weight: 600;
        color: black;
        text-align: left;
    }
</style>
<div class="user-card tScoresCard">
    <app-loading-spinner *ngIf="loading"></app-loading-spinner>
    <ng-container *ngIf="shouldShowSubfactors">
        <div class="d-flex justify-content-between align-items-center">
            <a class="fw-bold insights-card-headings" href="{{ helpUrl }}" target="_blank"
                ><span data-testId="title" pTooltip="Learn how to use these insights" tooltipPosition="top" tooltipEvent="hover"
                    >T-Scores <small>(20-80, Mid-range scores are 45-55)</small></span
                >
            </a>
            <ng-container *ngIf="shouldShowSubfactors">
                <button pButton *ngIf="!isSubfactorsVisible; else down" (click)="showSubFactors()" class="t-score-collapsed" icon="pi pi-angle-right"></button>
                <ng-template #down>
                    <button pButton (click)="showSubFactors()" class="t-score-collapsed" icon="pi pi-angle-down"></button>
                </ng-template>
            </ng-container>
        </div>
    </ng-container>
    <div class="t-chart">
        <ng-container *ngIf="showFactorList; else onlyChart">
            <table width="100%">
                <tr>
                    <td width="80%">
                        <table width="94%" class="traits-wrap">
                            <tr>
                                <td align="left">
                                    <h5>Left Traits</h5>
                                </td>
                                <td align="right">
                                    <h5>Right Traits</h5>
                                </td>
                            </tr>
                        </table>
                        <app-double-axes-horizontal-bar
                            data-testId="double-axe-chart"
                            [showLabel]="showLabel"
                            [bgColor]="bgColor"
                            [index]="index"
                            [chartData]="chartData"
                            [isSubfactorsVisible]="isSubfactorsVisible"
                            [showFactorList]="showFactorList"
                        >
                        </app-double-axes-horizontal-bar>
                    </td>
                    <!-- <td style="padding-top: 40px; padding-bottom: 40px">
                        <div style="border-left: 1px solid black; height: 100%; width: 1px"></div>
                    </td> -->
                    <td width="20%" class="factor-wrap">
                        <h5>Factors</h5>

                        <ul>
                            <li>Commanding</li>
                            <li>People</li>
                            <li>Patience</li>
                            <li>Structure</li>
                            <li>Trust</li>
                            <li>Pioneering</li>
                            <li>Risk</li>
                            <li>Creativity</li>
                        </ul>
                    </td>
                </tr>
            </table>
        </ng-container>

        <!-- Template for else condition -->
        <ng-template #onlyChart>
            <app-double-axes-horizontal-bar
                data-testId="double-axe-chart"
                [showLabel]="showLabel"
                [bgColor]="bgColor"
                [index]="index"
                [chartData]="chartData"
                [isSubfactorsVisible]="isSubfactorsVisible"
            >
            </app-double-axes-horizontal-bar>
        </ng-template>
    </div>
</div>
