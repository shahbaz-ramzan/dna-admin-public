<div class="crCard w-100 position-relative">
    <a class="fw-bold insights-card-headings" href="https://kb.dnabehavior.com/gene/work-talent-cards-explained#Career-Insights" target="_blank"
        ><span data-testId="title" pTooltip="Learn how to use these insights" tooltipPosition="top" tooltipEvent="hover">Career Insights</span>
    </a>
    <app-loading-spinner *ngIf="loading"></app-loading-spinner>
    <div data-testId="content" *ngIf="!loading">
        <ul>
            <li *ngFor="let careerInsight of careerInsightsObject?.insights; let i = index">
                {{ careerInsight }}
            </li>
        </ul>
    </div>
</div>
