<div class="user-card tScoresCard">
    <app-loading-spinner *ngIf="loading"></app-loading-spinner>

    <div class="d-flex justify-content-between align-items-center">
        <h3 class="graphHeading">T-Scores <small>(20-80, Mid-range scores are 45-55)</small></h3>
    </div>
    <div class="t-chart">
        <app-factors-horizontal-bar [showLabel]="showLabel" [bgColor]="bgColor" [index]="index" [chartData]="chartData"></app-factors-horizontal-bar>
    </div>
</div>
