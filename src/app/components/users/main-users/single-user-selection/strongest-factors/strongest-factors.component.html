<div class="user-card sfCard">
    <a class="fw-bold insights-card-headings" href="https://kb.dnabehavior.com/gene/work-talent-cards-explained#Two-Strongest-Traits" target="_blank"
        ><span data-testId="title" pTooltip="Learn how to use these insights" tooltipPosition="top" tooltipEvent="hover">Two Strongest Traits</span>
    </a>
    <p>Based on your factor scores, your two strongest behavioral traits are:</p>
    <app-loading-spinner *ngIf="loading"></app-loading-spinner>
    <div data-testId="content" *ngIf="!loading">
        <ul *ngFor="let strongestFactor of strongestFactorsObject?.factors">
            <li>{{ strongestFactor }}</li>
        </ul>
    </div>
</div>
