<div style="height: auto">
    <p-table
        data-testId="table"
        [value]="data"
        [paginator]="showPagination"
        [rows]="rows"
        [showCurrentPageReport]="true"
        [(selection)]="selectedItems"
        (selectionChange)="getSelectedItems()"
    >
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="code" id="1" *ngIf="canSelect" style="width: 5rem">
                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                </th>
                <ng-container *ngFor="let item of header; trackBy: trackByIndex">
                    <th id="2" pSortableColumn="code">
                        {{ item }}
                    </th>
                </ng-container>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr>
                <td *ngIf="canSelect">
                    <p-tableCheckbox [value]="item"></p-tableCheckbox>
                </td>
                <td *ngFor="let key of dataKeys; trackBy: trackByIndex">
                    <img
                        *ngIf="showIcon && key === iconCol"
                        [src]="item.profileImage ? item.profileImage : '../../../../assets/images/profile.svg'"
                        alt="icon"
                        width="35"
                        height="35"
                        style="border-radius: 50%"
                    />
                    <span>
                        {{ item[key] }}
                    </span>
                </td>
                <td *ngIf="iconArrow">
                    <i class="icon-right-arrow"></i>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
