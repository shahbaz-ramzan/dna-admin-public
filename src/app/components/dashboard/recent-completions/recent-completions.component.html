<div class="d-flex justify-content-between">
    <span data-testId="heading" class="graphHeading">Completion in Last 30 Days</span>
    <!-- <i *ngIf="!toogle" (click)="expand()" class="icon-expand"></i> -->
    <!-- <i *ngIf="toogle" (click)="collapse()" class="icon-collape-arrow"></i> -->
</div>
<div id="dnaTable" style="margin-top: 20px">
    <app-loading-spinner *ngIf="loading"></app-loading-spinner>
    <div class="dashboard-table completion w-100">
        <app-table
            data-testId="table"
            [header]="header"
            [dataKeys]="dataKeys"
            [data]="data"
            [showPagination]="false"
            [rows]="3"
            [showIcon]="true"
            iconCol="firstName"
            [canSelect]="false"
        ></app-table>
    </div>
</div>
