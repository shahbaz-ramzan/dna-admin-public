<!-- <app-loading-spinner *ngIf="loading"></app-loading-spinner> -->
<div *ngIf="!loading">
    <h4>Who reviews the results?</h4>
    <div ngClass="form-group mw-420">
        <label>Who serves your {{ selectedParticipantLabel.name }}s?</label>
        <p-dropdown
            #label="ngModel"
            [(ngModel)]="selectedReviewsLabel"
            (onChange)="getLabelName()"
            inputId="dropdown"
            [options]="labels"
            [autoDisplayFirst]="false"
            placeholder="Select Label"
            optionLabel="name"
            ngClass="p-dropdown"
            [ngStyle]="{
                'border-color': (isValidationChecked && !isReviewsLabelValid) || (label.touched && !isReviewsLabelValid) ? 'red' : ''
            }"
        >
        </p-dropdown>

        <span style="color: red" *ngIf="(isValidationChecked && !isReviewsLabelValid) || (label.touched && !isReviewsLabelValid)">
            Please Select Label<br />
        </span>
        <small ngClass="form-group-helper">This will be used to personalize your Account and can be changed in the Account Settings later.</small>
    </div>
</div>
